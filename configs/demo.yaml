# configs/demo.yaml
# -----------------
# DEMO CONFIG: Small, fast end-to-end run.
# Target runtime: < 3 minutes on CPU for all 4 methods combined.
# Use this config for live demos and phase verification.
#
# To run:
#   python demo.py
#   python run_experiment.py --config configs/demo.yaml --method all

seed: 42
num_seeds: 1

# Topology
num_clients: 20
num_clusters: 3
clients_per_cluster: [7, 7, 6]
num_classes: 10
num_features: 20

# Cadences (independent, as per the paper's contribution)
num_rounds: 30
T_FL: 1    # Aggregate FL model every round
T_RL: 5    # Federate RL policies every 5 rounds (federated_marl only)

# Methods to run when method=all
methods:
  - random
  - full
  - oort
  - centralized_rl
  - federated_marl

# Policy federation config (federated_marl only)
federation:
  alpha: 0.5    # soft-update: 0.5*local + 0.5*meta
  mode: soft    # soft | hard

# RL hyperparameters
rl:
  k_select: 5           # clients selected per cluster per round
  lr_actor: 3.0e-4
  lr_critic: 1.0e-3
  ppo_epochs: 3
  clip_eps: 0.2
  entropy_coef: 0.01
  update_every_n_rounds: 1  # PPO fires every round (equal gradient budget for CRL and FMARL)
  reward_weights:
    accuracy: 1.0
    energy: 0.1
    fairness: 0.05

# FL training hyperparameters
fl:
  local_epochs: 2
  batch_size: 32
  lr: 0.01
  hidden1: 128
  hidden2: 64

# Data generation
data:
  dirichlet_alpha: 0.5    # non-IID skew (lower = more heterogeneous)
  num_samples_per_client: 200

# Churn/dropout model
churn:
  mode: mild
  dropout_prob: 0.1
  battery_drain_per_round: 0.05

# Network simulation
network:
  bandwidth_mean: 10.0    # Mbps
  bandwidth_std: 5.0
  latency_mean: 0.05      # seconds
  round_deadline: 1.0        # tightened so ~8-15% of uploads straggle (L5: network now filters aggregation)    # seconds (SimPy simulated time)

# Logging
logging:
  save_csv: true
  save_plots: true
  results_dir: results/demo/
  verbose: true


# Device energy model (L2): grounded compute + communication energy in Joules.
# Constants are order-of-magnitude mobile values, tunable/auditable; to be
# replaced by measured device power profiles in the real-data phase.
energy:
  e_compute_per_mac_j: 1.0e-9
  e_comm_per_bit_j: 1.0e-7
  fwd_bwd_factor: 3.0
  min_efficiency: 0.1
